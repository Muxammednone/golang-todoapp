basePath: /api/v1
definitions:
  auth_transport_http.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth_transport_http.LoginResponseDTO:
    properties:
      access_token:
        type: string
    type: object
  auth_transport_http.MeResponseDTO:
    properties:
      sso_user_id:
        type: integer
    type: object
  auth_transport_http.RegisterRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth_transport_http.RegisterResponseDTO:
    properties:
      user_id:
        type: integer
    type: object
  core_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable example
        type: string
    type: object
  statistics_transport_http.GetStatisticsResponse:
    properties:
      tasks_average_completion_time:
        example: 1m30s
        type: string
      tasks_completed:
        example: 10
        type: integer
      tasks_completed_rate:
        example: 20
        type: number
      tasks_created:
        example: 50
        type: integer
    type: object
  tasks_transport_http.CreateTaskRequest:
    properties:
      description:
        example: Сделать до четверга домашнее задание по математике
        maxLength: 1000
        minLength: 1
        type: string
      title:
        example: Домашка
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  tasks_transport_http.CreateTaskResponse:
    properties:
      author_user_id:
        example: 5
        type: integer
      completed:
        example: false
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-01T10:30:00Z"
        type: string
      description:
        example: Сделать до четверга домашнее задание по математике
        type: string
      id:
        example: 15
        type: integer
      title:
        example: Домашка
        type: string
      version:
        example: 3
        type: integer
    type: object
  tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        example: 5
        type: integer
      completed:
        example: false
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-01T10:30:00Z"
        type: string
      description:
        example: Сделать до четверга домашнее задание по математике
        type: string
      id:
        example: 15
        type: integer
      title:
        example: Домашка
        type: string
      version:
        example: 3
        type: integer
    type: object
  tasks_transport_http.PatchTaskRequest:
    properties:
      completed:
        type: boolean
      description:
        example: "null"
        type: string
      title:
        example: Погулять с собакой
        type: string
    type: object
  tasks_transport_http.PatchTaskResponse:
    properties:
      author_user_id:
        example: 5
        type: integer
      completed:
        example: false
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-01T10:30:00Z"
        type: string
      description:
        example: Сделать до четверга домашнее задание по математике
        type: string
      id:
        example: 15
        type: integer
      title:
        example: Домашка
        type: string
      version:
        example: 3
        type: integer
    type: object
  tasks_transport_http.TaskDTOResponse:
    properties:
      author_user_id:
        example: 5
        type: integer
      completed:
        example: false
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-02-01T10:30:00Z"
        type: string
      description:
        example: Сделать до четверга домашнее задание по математике
        type: string
      id:
        example: 15
        type: integer
      title:
        example: Домашка
        type: string
      version:
        example: 3
        type: integer
    type: object
  users_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: Ivan Ivanov
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        example: "+79876548967"
        maxLength: 15
        minLength: 10
        type: string
    required:
    - full_name
    type: object
  users_transport_http.UserDTOResponse:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      id:
        example: 10
        type: integer
      phone_number:
        example: "+79876548967"
        type: string
      version:
        example: 3
        type: integer
    type: object
info:
  contact: {}
  description: Todo Application REST-API schema
  title: Golang Todo API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_transport_http.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/auth_transport_http.LoginResponseDTO'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "503":
          description: SSO unavailable
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "504":
          description: SSO timeout
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Login and receive a JWT
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/auth_transport_http.MeResponseDTO'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get SSO account ID from JWT; no profile required
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth_transport_http.RegisterRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            $ref: '#/definitions/auth_transport_http.RegisterResponseDTO'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "503":
          description: SSO unavailable
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "504":
          description: SSO timeout
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      summary: Register an SSO account
      tags:
      - auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/users_transport_http.UserDTOResponse'
        "401":
          description: JWT required
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Create a profile first
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get your TodoApp profile
      tags:
      - profile
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            $ref: '#/definitions/users_transport_http.UserDTOResponse'
        "400":
          description: Invalid profile
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: JWT required
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Profile already exists
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create your TodoApp profile
      tags:
      - profile
  /statistics:
    get:
      description: Просмотр статистики своих задач за выбранный период
      parameters:
      - description: 'Начало промежутка рассмотрения статистики (включительно), формат:
          YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'Конец промежутка рассмотрения статистики (не включительно),
          формат: YYYY-MM-DD'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученная статистика
          schema:
            $ref: '#/definitions/statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Create a profile via POST /me first
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение статистики
      tags:
      - statistics
  /tasks:
    get:
      description: Просмотр своих задач с опциональной пагинацией
      parameters:
      - description: Размер страницы с задачами
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с задачами
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка задач
          schema:
            items:
              $ref: '#/definitions/tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Create a profile via POST /me first
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создать новую задачу в системе
      parameters:
      - description: CreateTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная задача
          schema:
            $ref: '#/definitions/tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Create a profile via POST /me first
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаление существующей задачи в системе по ее ID
      parameters:
      - description: ID удаляемой задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удаление задачи
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Profile missing, task absent or owned by another account
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление задачи
      tags:
      - tasks
    get:
      description: Получение конкретной задачи по её ID
      parameters:
      - description: ID получаемой задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задача успешно найдена
          schema:
            $ref: '#/definitions/tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Profile missing, task absent or owned by another account
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение задачи
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Обновляет информацию об уже существующей в системе задаче
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `description` игнорируется, значение в БД не меняется
        2. **Явно передано значение: `"description": "some description"` - устанавливает новое описание в БД
        3. **Передан null: `"description": null` - очищает поле в БД (set to NULL)
        Ограничения: `title` и `completed` не могут быть выставлены как NULL
      parameters:
      - description: ID изменяемой задачи
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно измененная задача
          schema:
            $ref: '#/definitions/tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "401":
          description: Invalid or expired JWT
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "404":
          description: Profile missing, task absent or owned by another account
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить задачу
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: Enter Bearer <access_token> returned by POST /auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
